name: 'Release'

on:
  workflow_dispatch:
    inputs:
      # Fill release/tag version
      release-version:
        description: "Release version [999.999.999]:"
        required: true

jobs:
  git_tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Add git TAG
        run: |
          git config --local user.email "release@smartlook.com"
          git config --local user.name "${{ github.actor }}"
          git tag -a "${{ github.event.inputs.release-version }}" -m "${{ github.event.inputs.release-version }}"
          git push --follow-tags

  ktlint:
    runs-on: ubuntu-latest
    needs: [git_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run ktlint check
        uses: ./.github/actions/ktlint

  dry_build:
    runs-on: ubuntu-latest
    needs: [ktlint, git_tag]

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Dry build
        uses: ./.github/actions/assemble

  unit_tests:
    runs-on: ubuntu-latest
    needs: [ktlint, git_tag, dry_build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        uses: ./.github/actions/test-unit

  prepare_release:
    runs-on: ubuntu-latest
    needs: [dry_build, ktlint, unit_tests, git_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '11'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup artifactory credentials
        uses: ./.github/actions/setup-artifactory
        with:
          token: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Release build
        uses: ./.github/actions/release-native

      - name: Save build artifacts
        uses: ./.github/actions/save-artifacts

  git_release:
    runs-on: ubuntu-latest
    needs: [dry_build, ktlint, unit_tests, prepare_release, git_tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Zip artifacts
        run: |
          zip -r release.zip "./release-artifacts/output/com/splunk/android"

      - name: Create Release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
        id: create_release
        with:
          draft: false
          prerelease: false
          name: ${{ github.event.inputs.release-version }}
          tag: ${{ github.event.inputs.release-version }}
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: ./.github/actions/upload_github_artifacts
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}

  publish_release_to_s3:
    runs-on: ubuntu-latest
    needs: [dry_build, ktlint, unit_tests, prepare_release, git_tag, git_release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R

      - name: Prepare files for upload to S3
        uses: ./.github/actions/prepare-files-for-s3
        with:
          release-version: ${{ github.event.inputs.release-version }}

      - name: Display structure of prepared files
        run: ls -R

      - name: Upload to S3
        uses: ./.github/actions/publish_release_to_s3
        with:
          release-version: ${{ github.event.inputs.release-version }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.AWS_SECRET_ACCESS_KEY }}