name: 'PR[*]'

on:
  # Run workflow after pull-request
  pull_request:

jobs:

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run ktlint check
        uses: ./.github/actions/ktlint

  unit_tests:
    runs-on: ubuntu-latest
    needs: [ktlint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        uses: ./.github/actions/test-unit
 
  dry_build:
    runs-on: ubuntu-latest
    needs: [ktlint, unit_tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Dry build
        uses: ./.github/actions/assemble

  